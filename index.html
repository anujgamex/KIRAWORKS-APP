<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AG SUPERNOVA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#0ea5e9', // Light Blue (Sky 500)
                        secondary: '#e0f2fe', // Sky 100
                        dark: '#0f172a'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f0f9ff; margin: 0; display: flex; justify-content: center; min-height: 100vh; font-family: 'Inter', sans-serif; }
        #app-frame { width: 100%; max-width: 420px; height: 100vh; background-color: #ffffff; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        @media (min-width: 421px) { #app-frame { height: 90vh; margin-top: 5vh; border-radius: 20px; border: 4px solid #bae6fd; } }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Modal & Toasts */
        #toast-box { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; width: 90%; pointer-events: none; }
        .toast { padding: 12px 16px; border-radius: 8px; color: white; font-weight: 600; font-size: 14px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); opacity: 0; transition: 0.3s; transform: translateY(-10px); }
        .toast.show { opacity: 1; transform: translateY(0); }
        
        .floating-btn { position: absolute; bottom: 80px; right: 20px; background: #0ea5e9; color: white; width: 50px; height: 50px; border-radius: 25px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(14, 165, 233, 0.4); cursor: pointer; z-index: 50; transition: transform 0.2s; }
        .floating-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <div id="app-frame">
        <div id="toast-box"></div>

        <header id="main-header" class="hidden bg-primary text-white p-4 flex justify-between items-center shadow-sm z-10">
            <div class="flex items-center gap-2 font-black text-lg tracking-wider">
                <i class="fa-solid fa-crosshairs"></i> AG SUPERNOVA
            </div>
            <div class="flex items-center gap-3">
                <div id="wallet-badge" class="hidden bg-white/20 px-3 py-1 rounded-full text-sm font-bold items-center gap-1 cursor-pointer">
                    <i class="fa-solid fa-wallet"></i> ₹<span id="header-bal">0</span>
                </div>
                <button onclick="appLogout()" class="text-white/90 hover:text-white"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto hide-scrollbar bg-gray-50 relative">
            
            <!-- Login Screen -->
            <div id="view-login" class="tab-content active h-full flex flex-col items-center justify-center p-6 bg-white">
                <div class="w-24 h-24 bg-secondary rounded-full flex items-center justify-center mb-4">
                    <i class="fa-solid fa-gamepad text-5xl text-primary"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-800 mb-1">AG SUPERNOVA</h1>
                <p class="text-slate-500 text-sm mb-8">Play Tournaments & Win Real Cash</p>
                
                <div class="w-full space-y-4">
                    <div>
                        <label class="text-xs font-bold text-slate-500 mb-1 block">MOBILE NUMBER</label>
                        <input type="tel" id="login-phone" placeholder="Enter 10 digit number" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition font-medium">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 mb-1 block">PASSWORD</label>
                        <input type="password" id="login-pass" placeholder="Set or enter password" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition font-medium">
                    </div>
                    <button id="login-btn" onclick="appLogin()" class="w-full bg-primary text-white font-bold py-3.5 rounded-xl shadow-lg shadow-primary/30 active:scale-[0.98] transition mt-2">
                        LOGIN / REGISTER
                    </button>
                </div>
            </div>

            <!-- User Home (Matches) -->
            <div id="view-user-matches" class="tab-content p-4 pb-24">
                <div class="bg-gradient-to-r from-primary to-sky-400 rounded-2xl p-4 text-white shadow-md mb-6 relative overflow-hidden">
                    <div class="relative z-10">
                        <span class="bg-white/20 text-xs font-bold px-2 py-1 rounded mb-2 inline-block">UPCOMING</span>
                        <h2 class="text-xl font-black mb-1" id="banner-title">Loading...</h2>
                        <p class="text-sm font-medium opacity-90" id="banner-time">Check out the latest matches!</p>
                    </div>
                    <i class="fa-solid fa-trophy absolute -right-4 -bottom-4 text-7xl text-white opacity-10"></i>
                </div>
                
                <h3 class="font-bold text-slate-700 mb-3 px-1">Available Matches</h3>
                <div id="user-matches-list" class="space-y-4">
                    <!-- Matches injected here -->
                </div>
            </div>

            <!-- User Wallet -->
            <div id="view-user-wallet" class="tab-content p-4 pb-24">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 text-center mb-6">
                    <p class="text-slate-500 text-sm font-bold mb-1">CURRENT BALANCE</p>
                    <h2 class="text-4xl font-black text-slate-800 mb-4">₹<span id="wallet-page-bal">0</span></h2>
                </div>

                <div class="space-y-6">
                    <!-- Add Money -->
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                        <h3 class="font-bold text-slate-700 mb-3 flex items-center gap-2"><i class="fa-solid fa-circle-arrow-down text-green-500"></i> Add Money</h3>
                        <div class="bg-secondary p-3 rounded-lg mb-3 flex justify-between items-center border border-primary/20">
                            <div>
                                <p class="text-xs text-slate-500 font-bold">UPI ID (Scan & Pay)</p>
                                <p class="font-bold text-primary select-all">guriya634@fam</p>
                            </div>
                            <i class="fa-brands fa-google-pay text-2xl text-slate-600"></i>
                        </div>
                        <input type="number" id="add-amt" placeholder="Amount (₹)" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm mb-2 outline-none focus:border-primary">
                        <input type="text" id="add-utr" placeholder="Enter 12-digit UTR No." class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm mb-3 outline-none focus:border-primary">
                        <button onclick="requestPayment('add')" class="w-full bg-slate-800 text-white font-bold py-2.5 rounded-lg text-sm">Send Request</button>
                    </div>

                    <!-- Withdraw Money -->
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                        <h3 class="font-bold text-slate-700 mb-3 flex items-center gap-2"><i class="fa-solid fa-circle-arrow-up text-red-500"></i> Withdraw Money</h3>
                        <input type="number" id="with-amt" placeholder="Amount (₹)" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm mb-2 outline-none focus:border-primary">
                        <input type="text" id="with-upi" placeholder="Enter your UPI ID" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm mb-3 outline-none focus:border-primary">
                        <button onclick="requestPayment('withdraw')" class="w-full bg-slate-800 text-white font-bold py-2.5 rounded-lg text-sm">Request Withdrawal</button>
                    </div>
                </div>
            </div>

            <!-- Admin Matches -->
            <div id="view-admin-matches" class="tab-content p-4 pb-24">
                <div class="bg-secondary border border-primary/20 p-4 rounded-xl mb-6">
                    <h3 class="font-bold text-primary mb-3">Add New Match</h3>
                    <input type="text" id="m-title" placeholder="Match Title (e.g. CS Rank Cup)" class="w-full border rounded-lg px-3 py-2 text-sm mb-2">
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <input type="number" id="m-fee" placeholder="Entry Fee (₹)" class="border rounded-lg px-3 py-2 text-sm">
                        <input type="number" id="m-prize" placeholder="Prize Pool (₹)" class="border rounded-lg px-3 py-2 text-sm">
                    </div>
                    <input type="text" id="m-time" placeholder="Time (e.g. 8:00 PM Today)" class="w-full border rounded-lg px-3 py-2 text-sm mb-3">
                    <button onclick="adminCreateMatch()" class="w-full bg-primary text-white font-bold py-2 rounded-lg text-sm">Publish Match</button>
                </div>
                <h3 class="font-bold text-slate-700 mb-3">Active Matches</h3>
                <div id="admin-matches-list" class="space-y-3"></div>
            </div>

            <!-- Admin Wallets (Users) -->
            <div id="view-admin-users" class="tab-content p-4 pb-24">
                <h3 class="font-bold text-slate-700 mb-3">Manage Users</h3>
                <div id="admin-users-list" class="space-y-3"></div>
            </div>

            <!-- Admin Requests -->
            <div id="view-admin-requests" class="tab-content p-4 pb-24">
                <h3 class="font-bold text-slate-700 mb-3">Pending Transactions</h3>
                <div id="admin-req-list" class="space-y-3"></div>
            </div>
            
        </main>

        <a href="https://t.me/SUPERNOVA_UPDATES" target="_blank" id="tg-btn" class="floating-btn hidden">
            <i class="fa-brands fa-telegram text-2xl"></i>
        </a>

        <nav id="bottom-nav" class="hidden bg-white border-t border-slate-100 flex justify-around p-2 pb-safe shadow-[0_-4px_10px_rgba(0,0,0,0.02)] z-10">
            <!-- Dynamically populated based on role -->
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ag-supernova-v1';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "demo", projectId: "demo" };
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) { console.error("Firebase init err", e); }

        const ADMINS = ['7888499636', '1987654321'];
        const PATH = `artifacts/${appId}/public/data`;
        
        let state = {
            currentUser: null, // { phone, password, balance }
            isAdmin: false,
            matches: [],
            users: [],
            requests: [],
            unsubs: []
        };

        // --- Helpers ---
        window.showToast = (msg, type = 'success') => {
            const box = document.getElementById('toast-box');
            const t = document.createElement('div');
            t.className = `toast ${type === 'error' ? 'bg-red-500' : 'bg-slate-800'}`;
            t.innerText = msg;
            box.appendChild(t);
            setTimeout(() => t.classList.add('show'), 10);
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
        };

        window.switchTab = (tabId) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            // Update Nav styling
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-primary');
                btn.classList.add('text-slate-400');
                if(btn.dataset.target === tabId) {
                    btn.classList.add('text-primary');
                    btn.classList.remove('text-slate-400');
                }
            });
            renderData();
        };

        function setupNav() {
            const nav = document.getElementById('bottom-nav');
            if(state.isAdmin) {
                nav.innerHTML = `
                    <button class="nav-btn flex flex-col items-center text-primary" data-target="view-admin-matches" onclick="switchTab('view-admin-matches')"><i class="fa-solid fa-gamepad text-lg"></i><span class="text-[10px] font-bold mt-1">Matches</span></button>
                    <button class="nav-btn flex flex-col items-center text-slate-400" data-target="view-admin-users" onclick="switchTab('view-admin-users')"><i class="fa-solid fa-users text-lg"></i><span class="text-[10px] font-bold mt-1">Wallets</span></button>
                    <button class="nav-btn flex flex-col items-center text-slate-400 relative" data-target="view-admin-requests" onclick="switchTab('view-admin-requests')"><i class="fa-solid fa-money-bill-transfer text-lg"></i><span class="text-[10px] font-bold mt-1">Requests</span></button>
                `;
            } else {
                nav.innerHTML = `
                    <button class="nav-btn flex flex-col items-center text-primary" data-target="view-user-matches" onclick="switchTab('view-user-matches')"><i class="fa-solid fa-trophy text-lg"></i><span class="text-[10px] font-bold mt-1">Tournaments</span></button>
                    <button class="nav-btn flex flex-col items-center text-slate-400" data-target="view-user-wallet" onclick="switchTab('view-user-wallet')"><i class="fa-solid fa-wallet text-lg"></i><span class="text-[10px] font-bold mt-1">Wallet</span></button>
                `;
            }
        }

        // --- Auth Logic ---
        window.appLogin = async () => {
            const phone = document.getElementById('login-phone').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const btn = document.getElementById('login-btn');

            if(phone.length < 10) return showToast("Enter 10-digit number", "error");
            if(pass.length < 4) return showToast("Enter a valid password", "error");

            btn.innerText = "Please wait..."; btn.disabled = true;

            try {
                if (initialAuthToken) await signInWithCustomToken(auth, initialAuthToken);
                else await signInAnonymously(auth);

                const uRef = doc(db, PATH, 'users', phone);
                const snap = await getDoc(uRef);

                if(snap.exists()) {
                    if(snap.data().password !== pass) {
                        btn.innerText = "LOGIN / REGISTER"; btn.disabled = false;
                        return showToast("Incorrect Password!", "error");
                    }
                    state.currentUser = { phone, ...snap.data() };
                } else {
                    const newUser = { phone, password: pass, balance: 0, joined: Date.now() };
                    await setDoc(uRef, newUser);
                    state.currentUser = newUser;
                }

                state.isAdmin = ADMINS.includes(phone);
                
                // Show UI
                document.getElementById('main-header').classList.remove('hidden');
                document.getElementById('bottom-nav').classList.remove('hidden');
                document.getElementById('tg-btn').classList.remove('hidden');
                
                if(!state.isAdmin) {
                    document.getElementById('wallet-badge').classList.remove('hidden');
                    document.getElementById('wallet-badge').style.display = 'flex';
                }

                setupNav();
                startListeners();
                switchTab(state.isAdmin ? 'view-admin-matches' : 'view-user-matches');
                showToast("Login Successful!");

            } catch(e) {
                console.error(e);
                showToast("Network Error", "error");
                btn.innerText = "LOGIN / REGISTER"; btn.disabled = false;
            }
        };

        window.appLogout = () => {
            state.unsubs.forEach(u => u());
            state.unsubs = [];
            state.currentUser = null;
            document.getElementById('main-header').classList.add('hidden');
            document.getElementById('bottom-nav').classList.add('hidden');
            document.getElementById('tg-btn').classList.add('hidden');
            switchTab('view-login');
            document.getElementById('login-btn').innerText = "LOGIN / REGISTER";
            document.getElementById('login-btn').disabled = false;
            document.getElementById('login-phone').value = '';
            document.getElementById('login-pass').value = '';
        };

        // --- Listeners & Rendering ---
        function startListeners() {
            // Listen to My Profile
            state.unsubs.push(onSnapshot(doc(db, PATH, 'users', state.currentUser.phone), (doc) => {
                if(doc.exists()) {
                    state.currentUser.balance = doc.data().balance;
                    document.getElementById('header-bal').innerText = state.currentUser.balance;
                    document.getElementById('wallet-page-bal').innerText = state.currentUser.balance;
                }
            }, e => console.error(e)));

            // Listen to Matches
            state.unsubs.push(onSnapshot(collection(db, PATH, 'matches'), (snap) => {
                state.matches = [];
                snap.forEach(d => state.matches.push({id: d.id, ...d.data()}));
                state.matches.sort((a,b) => b.created - a.created);
                renderData();
            }, e => console.error(e)));

            // Admin only Listeners
            if(state.isAdmin) {
                state.unsubs.push(onSnapshot(collection(db, PATH, 'users'), (snap) => {
                    state.users = [];
                    snap.forEach(d => state.users.push({id: d.id, ...d.data()}));
                    renderData();
                }, e => console.error(e)));

                state.unsubs.push(onSnapshot(collection(db, PATH, 'payments'), (snap) => {
                    state.requests = [];
                    snap.forEach(d => state.requests.push({id: d.id, ...d.data()}));
                    state.requests.sort((a,b) => b.time - a.time);
                    renderData();
                }, e => console.error(e)));
            }
        }

        function renderData() {
            if(!state.currentUser) return;

            // Render User Matches
            if(!state.isAdmin) {
                if(state.matches.length > 0) {
                    document.getElementById('banner-title').innerText = state.matches[0].title;
                    document.getElementById('banner-time').innerText = "Time: " + state.matches[0].time;
                }
                
                const mList = document.getElementById('user-matches-list');
                mList.innerHTML = state.matches.map(m => {
                    let parts = m.participants || [];
                    let joined = parts.includes(state.currentUser.phone);
                    return `
                    <div class="bg-white rounded-xl p-4 shadow-sm border border-slate-100 flex justify-between items-center">
                        <div>
                            <h4 class="font-bold text-slate-800">${m.title}</h4>
                            <p class="text-xs text-slate-500 font-medium mb-2"><i class="fa-regular fa-clock"></i> ${m.time}</p>
                            <div class="flex gap-3 text-sm">
                                <div><span class="text-slate-400 text-[10px] block">ENTRY</span><span class="font-bold text-primary">₹${m.fee}</span></div>
                                <div><span class="text-slate-400 text-[10px] block">PRIZE</span><span class="font-bold text-green-500">₹${m.prize}</span></div>
                            </div>
                        </div>
                        <button onclick="joinMatch('${m.id}', ${m.fee})" ${joined ? 'disabled' : ''} class="${joined ? 'bg-slate-200 text-slate-500' : 'bg-primary text-white shadow-md shadow-primary/30'} px-5 py-2 rounded-lg font-bold text-sm transition">
                            ${joined ? 'JOINED' : 'JOIN'}
                        </button>
                    </div>`;
                }).join('');
            }

            // Render Admin Views
            if(state.isAdmin) {
                // Matches
                document.getElementById('admin-matches-list').innerHTML = state.matches.map(m => `
                    <div class="bg-white rounded-xl p-3 border shadow-sm flex justify-between items-center">
                        <div>
                            <p class="font-bold text-sm">${m.title}</p>
                            <p class="text-xs text-slate-500">Fee: ₹${m.fee} | Prize: ₹${m.prize} | Joined: ${(m.participants||[]).length}</p>
                        </div>
                        <button onclick="adminDelMatch('${m.id}')" class="text-red-500 bg-red-50 p-2 rounded-lg"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `).join('');

                // Users
                document.getElementById('admin-users-list').innerHTML = state.users.map(u => `
                    <div class="bg-white rounded-xl p-3 border shadow-sm mb-2">
                        <div class="flex justify-between items-center mb-2">
                            <p class="font-bold text-sm"><i class="fa-solid fa-user text-slate-400"></i> ${u.phone}</p>
                            <span class="bg-secondary text-primary font-bold px-2 py-1 rounded text-xs">Bal: ₹${u.balance}</span>
                        </div>
                        <div class="flex gap-2">
                            <input type="number" id="amt-${u.phone}" placeholder="Amt" class="w-20 border rounded px-2 py-1 text-xs">
                            <button onclick="adminBal('${u.phone}', 'add')" class="bg-green-500 text-white px-3 rounded text-xs font-bold">Add</button>
                            <button onclick="adminBal('${u.phone}', 'cut')" class="bg-red-500 text-white px-3 rounded text-xs font-bold">Cut</button>
                        </div>
                    </div>
                `).join('');

                // Requests
                document.getElementById('admin-req-list').innerHTML = state.requests.map(r => `
                    <div class="bg-white rounded-xl p-3 border shadow-sm mb-2 ${r.status !== 'pending' ? 'opacity-60' : ''}">
                        <div class="flex justify-between">
                            <span class="font-bold text-sm flex items-center gap-1">
                                ${r.type === 'add' ? '<i class="fa-solid fa-arrow-down text-green-500"></i> ADD' : '<i class="fa-solid fa-arrow-up text-red-500"></i> WITHDRAW'}
                            </span>
                            <span class="font-bold ${r.status==='pending'?'text-orange-500':'text-slate-500'} text-xs uppercase">${r.status}</span>
                        </div>
                        <p class="text-xs text-slate-600 mt-1">User: <b>${r.phone}</b></p>
                        <p class="text-xs text-slate-600">Amount: <b>₹${r.amount}</b></p>
                        <p class="text-xs text-slate-600 font-mono mt-1 bg-slate-50 p-1 rounded border">${r.ref}</p>
                        ${r.status === 'pending' ? `
                        <div class="flex gap-2 mt-2">
                            <button onclick="adminProcessReq('${r.id}', '${r.phone}', '${r.type}', ${r.amount}, 'approved')" class="flex-1 bg-green-500 text-white rounded py-1.5 text-xs font-bold">APPROVE</button>
                            <button onclick="adminProcessReq('${r.id}', '${r.phone}', '${r.type}', ${r.amount}, 'rejected')" class="flex-1 bg-red-500 text-white rounded py-1.5 text-xs font-bold">REJECT</button>
                        </div>` : ''}
                    </div>
                `).join('');
            }
        }

        // --- User Actions ---
        window.joinMatch = async (mId, fee) => {
            if(state.currentUser.balance < fee) return showToast("Low Balance! Add Money.", "error");
            try {
                // Deduct
                await updateDoc(doc(db, PATH, 'users', state.currentUser.phone), { balance: state.currentUser.balance - fee });
                // Add to Match
                const m = state.matches.find(x => x.id === mId);
                let p = m.participants || [];
                if(!p.includes(state.currentUser.phone)) {
                    p.push(state.currentUser.phone);
                    await updateDoc(doc(db, PATH, 'matches', mId), { participants: p });
                    showToast("Joined Successfully!");
                }
            } catch(e) { showToast("Error joining", "error"); }
        };

        window.requestPayment = async (type) => {
            const amt = Number(document.getElementById(type==='add'?'add-amt':'with-amt').value);
            const ref = document.getElementById(type==='add'?'add-utr':'with-upi').value;
            
            if(!amt || amt <= 0) return showToast("Enter valid amount", "error");
            if(!ref) return showToast(`Enter ${type==='add'?'UTR':'UPI'}`, "error");
            
            if(type === 'withdraw' && amt > state.currentUser.balance) return showToast("Low Balance", "error");

            try {
                if(type === 'withdraw') {
                    await updateDoc(doc(db, PATH, 'users', state.currentUser.phone), { balance: state.currentUser.balance - amt });
                }
                await addDoc(collection(db, PATH, 'payments'), {
                    phone: state.currentUser.phone, type, amount: amt, ref, status: 'pending', time: Date.now()
                });
                showToast("Request Sent!");
                document.getElementById(type==='add'?'add-amt':'with-amt').value = '';
                document.getElementById(type==='add'?'add-utr':'with-upi').value = '';
            } catch(e) { showToast("Failed to request", "error"); }
        };

        // --- Admin Actions ---
        window.adminCreateMatch = async () => {
            const title = document.getElementById('m-title').value;
            const fee = Number(document.getElementById('m-fee').value);
            const prize = Number(document.getElementById('m-prize').value);
            const time = document.getElementById('m-time').value;
            if(!title || !fee || !time) return showToast("Fill details", "error");
            try {
                await addDoc(collection(db, PATH, 'matches'), { title, fee, prize, time, participants: [], created: Date.now() });
                showToast("Match Published");
            } catch(e) { showToast("Error", "error"); }
        };

        window.adminDelMatch = async (id) => { await deleteDoc(doc(db, PATH, 'matches', id)); };

        window.adminBal = async (phone, act) => {
            const amt = Number(document.getElementById(`amt-${phone}`).value);
            if(!amt) return;
            try {
                const uDoc = await getDoc(doc(db, PATH, 'users', phone));
                let bal = uDoc.data().balance;
                bal = act === 'add' ? bal + amt : Math.max(0, bal - amt);
                await updateDoc(doc(db, PATH, 'users', phone), { balance: bal });
                showToast("Balance Updated");
            } catch(e) {}
        };

        window.adminProcessReq = async (id, phone, type, amt, status) => {
            try {
                await updateDoc(doc(db, PATH, 'payments', id), { status });
                const uRef = doc(db, PATH, 'users', phone);
                const uDoc = await getDoc(uRef);
                
                if(type === 'add' && status === 'approved') {
                    await updateDoc(uRef, { balance: uDoc.data().balance + amt });
                } else if(type === 'withdraw' && status === 'rejected') {
                    await updateDoc(uRef, { balance: uDoc.data().balance + amt });
                }
                showToast(`Request ${status}`);
            } catch(e) {}
        };
    </script>
</body>
</html>
